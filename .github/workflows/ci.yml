name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Suppress Node.js 20 deprecation warnings from actions (checkout, etc.)
  # until upstream actions publish Node 24-compatible releases.
  ACTIONS_NODE20_DEPRECATION_WARNING: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install

      - run: pnpm check

      - run: pnpm test

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --manifest-path src-tauri/Cargo.toml

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared
            src-server

      - run: cargo check -p nalu-server

      - run: cargo clippy -p nalu-server -- -D warnings

      - run: cargo fmt -p nalu-server --check
